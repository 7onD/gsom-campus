# Раз в неделю обновляет список групп (src/data/groups.json) с timetable.spbu.ru.
# Если список изменился: коммит в main и перезапуск выкладки на Pages.
# Запустить вручную: вкладка Actions → «Refresh groups» → Run workflow.
name: Refresh groups

on:
  schedule:
    - cron: "17 3 * * 1" # по понедельникам, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Загрузить список групп
        run: python3 -I tools/fetch_groups.py
      - name: Закоммитить изменения и перезапустить выкладку
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/groups.json; then
            echo "Список групп не изменился"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/groups.json
          git commit -m "Автообновление списка групп"
          git push
          # пуш от имени бота сам выкладку не запускает — запускаем явно
          gh workflow run pages.yml --ref main
